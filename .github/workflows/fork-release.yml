name: fork-release

# This fork's APK for Obtainium: each push to main builds a release APK and publishes it as a GitHub release
# named <versionName>-fork.<run>, which is also the APK's versionName, so Obtainium sees what's installed.
# Signed with the debug key the phone's install has (secret DEBUG_KEYSTORE_BASE64), so it updates in place.
# Tags carry no leading v, so upstream's release.yml (tags v*) leaves them alone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Name the version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          version="$name-fork.$GITHUB_RUN_NUMBER"
          sed -i "s/^\( *versionName = \)\".*\"/\1\"$version\"/" app/build.gradle.kts
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch proot
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          scripts/fetch-proot.sh

      - name: Write the signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "The DEBUG_KEYSTORE_BASE64 secret isn't set; the APK wouldn't update the phone's install" >&2
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Test and build
        run: ./gradlew :owl:test :app:testDebugUnitTest :app:assembleRelease

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          apk="omalauncher-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > SHA256SUMS
          gh release create "$version" "$apk" SHA256SUMS --target "$GITHUB_SHA" --title "$version" \
            --notes "Built from $GITHUB_SHA on main."
